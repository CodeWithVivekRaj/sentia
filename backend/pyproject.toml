[tool.poetry]
name = "sentia"
version = "0.1.0"
description = "Sentia - A Digital Organism"
authors = ["Sentia <sentia@local>"]
packages = [{include = "sentia", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
websockets = "^12.0"
python-socketio = "^5.11.0"
sqlalchemy = "^2.0.30"
aiosqlite = "^0.20.0"
# chromadb = "^0.5.0"  # Phase 3 — enable after installing "Desktop development with C++" workload in VS Build Tools
rx = "^3.2.0"
apscheduler = "^3.10.4"
httpx = "^0.27.0"
pyyaml = "^6.0.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
numpy = ">=2.0.0"
python-multipart = "^0.0.9"
watchdog = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[tool.poetry.scripts]
sentia = "sentia.api.main:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
